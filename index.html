<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form</title>
  <style>
    body {
      font-family: Poppins, sans-serif;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      background: white;
      padding: 25px 35px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 320px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover {
      background: #0056b3;
    }
    .msg {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Contact Form</h2>
    <input type="text" id="name" placeholder="Enter your name" required />
    <input type="tel" id="phone" placeholder="Enter your phone number" required />
    <button onclick="submitData()">Submit</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxh4ZOK1gyQMtAQ1uouii91grvVr3zjSmUmcImobXFf7MKe2oI0kh5HZc54EA6AHCWTQ/exec"; // 👈 Add your Apps Script URL here

    async function submitData() {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const msg = document.getElementById("msg");

      if (!name || !phone) {
        msg.textContent = "Please enter both fields.";
        msg.style.color = "red";
        return;
      }

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ name, phone }),
          headers: { "Content-Type": "application/json" },
        });

        const result = await response.json();

        if (result.status === "success") {
          msg.textContent = "✅ Data submitted successfully!";
          msg.style.color = "green";
          document.getElementById("name").value = "";
          document.getElementById("phone").value = "";
        } else {
          msg.textContent = "❌ Submission failed.";
          msg.style.color = "red";
        }
      } catch (error) {
        msg.textContent = "⚠️ Error connecting to server.";
        msg.style.color = "red";
        console.error(error);
      }
    }
  </script>
</body>
</html>
