<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Google Sheets</title>
    <style>
        form {
            max-width: 400px;
            margin: auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="DATE"],
        input[type="number"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <form action="https://sheetdb.io/api/v1/xt6pamdeyi1ry" method="post">
        <input type="text" name="data[NAME]" id="uname" placeholder="name">
        <input type="email" name="data[EMAIL]" id="uemail" placeholder="email">
        <input type="number" name="data[PHONE]" id="unumber" placeholder="ph number">
        <input type="text" name="data[MESSAGE]" id="umsg" placeholder="your message..">
        <input type="submit" value="Contact Now">
    </form>
</body>

</html>
